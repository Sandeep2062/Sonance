name: Build & Release Sonance Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows Application with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --name "Sonance" --icon "assets/icon.ico" --add-data "ui;ui" --add-data "assets;assets" modern_lyrics_downloader.py

      - name: Compile Inno Setup Native Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path dist/Sonance/* -DestinationPath dist/Sonance-Windows-x86_64-portable.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/Sonance-Windows-x86_64-Installer.exe
            dist/Sonance-Windows-x86_64-portable.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Android Signing Keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Universal Release APK
        run: |
          mkdir -p artifacts
          flutter build apk --release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk artifacts/Sonance-android-all-arch.apk
          elif [ -f build/app/outputs/apk/release/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release.apk artifacts/Sonance-android-all-arch.apk
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: artifacts/Sonance-android-all-arch.apk

  build-linux:
    name: Build Linux Packages (deb, tar.xz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Linux Binary with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --name "sonance" --add-data "ui:ui" --add-data "assets:assets" modern_lyrics_downloader.py

      - name: Package Debian Installer (.deb) & Tarball
        run: |
          mkdir -p deb_pkg/opt/sonance
          mkdir -p deb_pkg/usr/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb_pkg/DEBIAN

          cp -r dist/sonance/* deb_pkg/opt/sonance/
          ln -s /opt/sonance/sonance deb_pkg/usr/bin/sonance
          cp assets/logo.png deb_pkg/usr/share/icons/hicolor/256x256/apps/sonance.png || true
          cp linux/sonance.desktop deb_pkg/usr/share/applications/

          cat <<EOF > deb_pkg/DEBIAN/control
          Package: sonance
          Version: 3.6.1
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Sandeep Khadka
          Description: Audiophile music suite and lossless streaming engine.
          EOF

          dpkg-deb --build deb_pkg dist/Sonance-linux-x86_64.deb
          tar -cJf dist/Sonance-linux-x86_64.tar.xz -C dist sonance

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/Sonance-linux-x86_64.deb
            dist/Sonance-linux-x86_64.tar.xz

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS Application Bundle with PyInstaller
        run: |
          pyinstaller --noconsole --windowed --name "Sonance" --icon "assets/icon.png" --add-data "ui:ui" --add-data "assets:assets" modern_lyrics_downloader.py

      - name: Package macOS DMG Installer
        run: |
          mkdir -p dmg_root
          cp -R dist/Sonance.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Sonance" -srcfolder dmg_root -ov -format UDZO dist/Sonance-macos-universal.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/Sonance-macos-universal.dmg

  release:
    name: Generate Checksums & Publish Release
    needs: [build-windows, build-android, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Consolidate & Generate Cryptographic Checksums
        run: |
          mkdir -p release-assets
          find staging/ -type f -exec cp {} release-assets/ \;

          cd release-assets
          sha256sum * > RELEASE.sha256sum
          md5sum * > RELEASE.md5sum

          echo "=== SHA-256 Manifest ==="
          cat RELEASE.sha256sum
          echo "=== MD5 Manifest ==="
          cat RELEASE.md5sum

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: "Sonance ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
