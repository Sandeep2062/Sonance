name: Build & Release Sonance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview tinytag requests beautifulsoup4 syncedlyrics pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "Sonance-windows-x86_64-setup" --add-data "ui;ui" modern_lyrics_downloader.py

      - name: Test Generated Executable
        run: |
          Test-Path dist/Sonance-windows-x86_64-setup.exe

      - name: Generate Checksums
        run: |
          cd dist
          $hash256 = (Get-FileHash -Algorithm SHA256 "Sonance-windows-x86_64-setup.exe").Hash.ToLower()
          $hash_md5 = (Get-FileHash -Algorithm MD5 "Sonance-windows-x86_64-setup.exe").Hash.ToLower()
          $size = (Get-Item "Sonance-windows-x86_64-setup.exe").Length
          "$hash256  Sonance-windows-x86_64-setup.exe" | Out-File -Encoding utf8 "RELEASE.sha256sum"
          "$hash_md5  Sonance-windows-x86_64-setup.exe" | Out-File -Encoding utf8 "RELEASE.md5sum"

      - name: Upload Release Artifacts to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Sonance-windows-x86_64-setup.exe
            dist/RELEASE.sha256sum
            dist/RELEASE.md5sum
          name: "Sonance ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
