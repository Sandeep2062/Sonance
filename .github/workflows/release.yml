name: Build & Release Sonance Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable (Native Flutter)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Native Release
        run: flutter build windows --release

      - name: Stage Native Release Files
        run: |
          New-Item -ItemType Directory -Force -Path dist/Sonance
          Copy-Item -Path build/windows/x64/runner/Release/* -Destination dist/Sonance/ -Recurse -Force

      - name: Compile Inno Setup Native Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path dist/Sonance/* -DestinationPath dist/Sonance-Windows-x86_64-portable.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-binaries
          path: |
            dist/Sonance-Windows-x86_64-Installer.exe
            dist/Sonance-Windows-x86_64-portable.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Android Signing Keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Universal Release APK
        run: |
          mkdir -p artifacts
          flutter build apk --release --android-skip-build-dependency-validation
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk artifacts/Sonance-android-all-arch.apk
          elif [ -f build/app/outputs/apk/release/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release.apk artifacts/Sonance-android-all-arch.apk
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-binary
          path: artifacts/Sonance-android-all-arch.apk

  build-linux:
    name: Build Linux Packages (deb, tar.xz) (Native Flutter)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Native Release
        run: flutter build linux --release

      - name: Package Debian Installer (.deb) & Tarball
        run: |
          mkdir -p deb_pkg/opt/sonance
          mkdir -p deb_pkg/usr/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb_pkg/DEBIAN

          mkdir -p dist
          cp -r build/linux/x64/release/bundle/* deb_pkg/opt/sonance/
          ln -s /opt/sonance/sonance deb_pkg/usr/bin/sonance
          cp assets/logo.png deb_pkg/usr/share/icons/hicolor/256x256/apps/sonance.png || true
          cp linux/sonance.desktop deb_pkg/usr/share/applications/

          cat <<EOF > deb_pkg/DEBIAN/control
          Package: sonance
          Version: 3.6.8
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Sandeep Khadka
          Description: Audiophile music suite and lossless streaming engine (Native Flutter).
          EOF

          dpkg-deb --build deb_pkg dist/Sonance-linux-x86_64.deb
          tar -cJf dist/Sonance-linux-x86_64.tar.xz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-binaries
          path: |
            dist/Sonance-linux-x86_64.deb
            dist/Sonance-linux-x86_64.tar.xz

  build-macos:
    name: Build macOS Universal DMG (Native Flutter)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter macOS Native Release
        run: flutter build macos --release

      - name: Package macOS DMG Installer
        run: |
          mkdir -p dmg_root
          mkdir -p dist
          cp -R build/macos/Build/Products/Release/sonance.app dmg_root/Sonance.app
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Sonance" -srcfolder dmg_root -ov -format UDZO dist/Sonance-macos-universal.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-binary
          path: dist/Sonance-macos-universal.dmg

  release:
    name: Generate Checksums & Publish Release
    needs: [build-windows, build-android, build-linux, build-macos]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: staging

      - name: Consolidate & Generate Cryptographic Checksums
        run: |
          mkdir -p release-assets
          find staging/ -type f -exec cp {} release-assets/ \;

          cd release-assets
          sha256sum * > RELEASE.sha256sum
          md5sum * > RELEASE.md5sum

          echo "=== SHA-256 Manifest ==="
          cat RELEASE.sha256sum
          echo "=== MD5 Manifest ==="
          cat RELEASE.md5sum

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          name: "Sonance ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
