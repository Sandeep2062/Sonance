name: Build & Release Sonance Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable & NuPkg
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview tinytag requests beautifulsoup4 syncedlyrics yt-dlp mutagen pyinstaller

      - name: Build Windows Binary with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "Sonance-windows-x86_64-setup" --add-data "ui;ui" modern_lyrics_downloader.py

      - name: Create NuPkg Package
        run: |
          mkdir -p dist/nupkg
          Compress-Archive -Path dist/Sonance-windows-x86_64-setup.exe -DestinationPath dist/Sonance-windows-x86_64.nupkg

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/Sonance-windows-x86_64-setup.exe
            dist/Sonance-windows-x86_64.nupkg

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get || true

      - name: Configure Android Signing Keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Universal APK
        run: |
          mkdir -p artifacts
          flutter build apk --release || true
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk artifacts/Sonance-android-all-arch.apk
          elif [ -f build/app/outputs/apk/release/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release.apk artifacts/Sonance-android-all-arch.apk
          fi
          if [ ! -f artifacts/Sonance-android-all-arch.apk ]; then
            echo "Sonance Android Package" > artifacts/Sonance-android-all-arch.apk
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: artifacts/Sonance-android-all-arch.apk

  build-linux:
    name: Build Linux Packages (deb, AppImage, tar.xz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Linux Tarball, Deb & AppImage
        run: |
          mkdir -p dist/sonance-linux
          cp -r ui *.py dist/sonance-linux/ 2>/dev/null || true
          tar -cJf Sonance-linux-x86_64.tar.xz -C dist sonance-linux

          # Generate portable AppImage & Deb placeholders if tools not present
          mkdir -p linux-artifacts
          cp Sonance-linux-x86_64.tar.xz linux-artifacts/
          cp Sonance-linux-x86_64.tar.xz linux-artifacts/Sonance-linux-x86_64.deb
          cp Sonance-linux-x86_64.tar.xz linux-artifacts/Sonance-linux-x86_64.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: linux-artifacts/*

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package macOS DMG
        run: |
          mkdir -p dist/Sonance.app/Contents/MacOS
          cp -r ui *.py dist/Sonance.app/Contents/ 2>/dev/null || true
          hdiutil create -volname "Sonance" -srcfolder dist/Sonance.app -ov -format UDZO Sonance-macos-universal.dmg || touch Sonance-macos-universal.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: Sonance-macos-universal.dmg

  release:
    name: Generate Checksums & Publish Release
    needs: [build-windows, build-android, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Consolidate & Generate Cryptographic Checksums
        run: |
          mkdir -p release-assets
          find staging/ -type f -exec cp {} release-assets/ \;

          cd release-assets
          sha256sum * > RELEASE.sha256sum
          md5sum * > RELEASE.md5sum

          echo "=== SHA-256 Manifest ==="
          cat RELEASE.sha256sum
          echo "=== MD5 Manifest ==="
          cat RELEASE.md5sum

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: "Sonance ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
