name: sonance
description: "The ultimate unified music suite — Stream, download Hi-Res lossless, and sing along with real-time synced lyrics."
publish_to: 'none'
version: 3.6.3+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Audio Playback & Background Media
  just_audio: ^0.9.38
  audio_service: ^0.18.15
  audio_session: ^0.1.19

  # Music Streaming & Audio Extraction
  youtube_explode_dart: ^2.2.0

  # Networking & Parallel Downloads
  http: ^1.2.1
  dio: ^5.4.3

  # Local Storage & Preferences
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cryptography & Deezer Stream Decryption
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # UI, Theming & Icons
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # System Utilities & In-App Updates
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.6
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
